id: baseline
label: 基线播放
player:
  mod_nes: always_greedy
  mod_enhancer: imdn
  mod_renderer: opencv
  use_fast_complete: false
metrics:
  recipes:
    - bones_qoe_v1
  quality:
    prefer:
      - local_catalog
    catalog_ref: content:bbb
cards:
  - key: qoe
    label: QoE
    digits: 2
    group: 播放质量
    hint: 平均画质减去振荡，再减去卡顿
  - key: avg_vmaf
    label: VMAF
    digits: 2
    group: 播放质量
    hint: 已评分段的平均画质
  - key: oscillation_vmaf
    label: 振荡
    digits: 2
    group: 播放质量
    hint: 相邻段画质差的平均
  - key: avg_freeze
    label: 均卡顿
    digits: 2
    suffix: " s"
    group: 播放质量
    hint: 总卡顿秒数除以播放段数
