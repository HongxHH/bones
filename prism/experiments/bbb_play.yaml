apiVersion: prism.lab/v1
kind: ExperimentSpec
metadata:
  name: bbb-play
  notes: "Import BBB DASH and play"
spec:
  content:
    source: path:player/data/video_mp4box
  arms:
    - id: play
      publish:
        plugin: identity
      session:
        policy:
          allowed_representation_ids: [0, 1, 2]
          mpd_type: static
      player:
        mod_nes: always_greedy
        mod_enhancer: imdn
        mod_renderer: opencv
        mod_downloader: tcp
        # Set mod_downloader: trace and a path under player/data to simulate network:
        # trace: data/3Glogs/report.2010-09-13_1003CEST.json
        trace: ""
  execution:
    arm_mode: serial
  collect:
    client_metrics: true
    interval_ms: 500
  # Enqueued on Stop Run (noop is safe without libvmaf). Swap plugin: vmaf when ready.
  measure:
    - plugin: noop
      params: {}
  # QoE is derived on the control plane. Default is the local VMAF table.
  # Add remote_catalog / compute to prefer when a catalog URL or reference video exists.
  metrics:
    recipes: [bones_qoe_v1]
    quality:
      prefer: [local_catalog]
      catalog_ref: content:bbb
