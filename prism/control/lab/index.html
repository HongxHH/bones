<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prism Lab</title>
  <style>
    :root {
      --ink: #0e1a22;
      --muted: #5a6b76;
      --paper: #eef3f5;
      --panel: #f7fafb;
      --line: rgba(14, 26, 34, 0.12);
      --accent: #0d6e6a;
      --accent-2: #0a5552;
      --warn: #b45309;
      --bad: #b42318;
      --ok: #0d6e6a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% 0%, rgba(13, 110, 106, 0.12), transparent 55%),
        radial-gradient(700px 360px at 100% 0%, rgba(180, 83, 9, 0.08), transparent 50%),
        linear-gradient(180deg, var(--paper), #dde6ea);
    }

    .shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: 1fr;
      }

      nav {
        position: sticky;
        top: 0;
        z-index: 2;
      }
    }

    nav {
      padding: 28px 20px;
      border-right: 1px solid var(--line);
      background: rgba(247, 250, 251, 0.72);
      backdrop-filter: blur(8px);
    }

    .brand {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.04em;
      margin: 0 0 4px;
      line-height: 1;
    }

    .brand span {
      color: var(--accent);
    }

    .tag {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 28px;
    }

    .nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      padding: 10px 12px;
      margin-bottom: 4px;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: rgba(13, 110, 106, 0.08);
    }

    .nav-btn.active {
      background: var(--accent);
      color: #fff;
    }

    main {
      padding: 28px 32px 48px;
    }

    h1 {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 28px;
      margin: 0 0 8px;
      letter-spacing: -0.03em;
    }

    .hint {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 14px 16px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat b {
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      font-weight: 500;
      color: var(--accent-2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: 13px;
    }

    th,
    td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    code,
    .mono {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
    }

    pre {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 14px;
      overflow: auto;
      max-height: 360px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .status-line.is-ok {
      margin-bottom: 10px;
    }

    .status-line.is-ok #conn {
      display: none;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--warn);
    }

    .dot.ok {
      background: var(--ok);
    }

    .dot.bad {
      background: var(--bad);
    }

    .msg {
      margin: 12px 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      font-size: 13px;
    }

    .msg.err {
      border-color: rgba(180, 35, 24, 0.35);
      color: var(--bad);
    }

    .msg.ok {
      border-color: rgba(13, 110, 106, 0.35);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    a {
      color: var(--accent-2);
    }

    .split {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
    }

    @media (max-width: 960px) {
      .split {
        grid-template-columns: 1fr;
      }
    }

    /* —— Unified section (配方 / 机器 / 历史 / 其它折叠) —— */
    details.sec {
      margin: 0 0 10px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    details.sec>summary {
      list-style: none;
      display: block;
      padding: 0;
      cursor: pointer;
      user-select: none;
      color: var(--ink);
    }

    details.sec>summary .sec-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      font-weight: 650;
      font-size: 13px;
    }

    details.sec>summary::-webkit-details-marker {
      display: none;
    }

    details.sec>summary .sec-row::before {
      content: "";
      flex: 0 0 auto;
      width: 0;
      height: 0;
      border-left: 5px solid var(--muted);
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      opacity: 0.75;
    }

    details.sec[open]>summary .sec-row::before {
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--muted);
      border-bottom: 0;
    }

    .sec-title {
      flex: 0 0 auto;
    }

    .report {
      margin-top: 12px;
    }

    .report h2 {
      margin: 14px 0 8px;
      font-size: 13px;
      font-weight: 650;
    }

    .report table {
      margin-bottom: 8px;
    }

    details.report-fold {
      margin: 10px 0 0;
    }

    details.report-fold>.sec-body.report {
      margin-top: 0;
      padding-top: 10px;
    }

    #playbackReport:empty,
    #playbackReport[hidden] {
      display: none;
    }

    .seg-open {
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      margin: 4px 0 10px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .seg-open:hover {
      background: rgba(13, 110, 106, 0.08);
    }

    #segmentDialog {
      width: min(1080px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      padding: 0;
      border: 1px solid var(--line);
      background: var(--paper, #f7fafb);
      color: var(--ink);
    }

    #segmentDialog::backdrop {
      background: rgba(14, 26, 34, 0.45);
    }

    .seg-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .seg-head strong {
      font-size: 15px;
    }

    .seg-head button {
      margin-left: auto;
      font: inherit;
      font-size: 13px;
      border: 1px solid var(--line);
      background: transparent;
      padding: 4px 10px;
      cursor: pointer;
    }

    .seg-filters {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
    }

    .seg-filters button {
      font: inherit;
      font-size: 12px;
      border: 1px solid var(--line);
      background: transparent;
      padding: 4px 8px;
      cursor: pointer;
    }

    .seg-filters button.is-on {
      background: var(--accent, #0d6e6a);
      color: #fff;
      border-color: transparent;
    }

    .seg-scroll {
      overflow: auto;
      max-height: calc(100vh - 140px);
      padding: 0 14px 14px;
    }

    .seg-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .seg-table th,
    .seg-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    .seg-table th {
      position: sticky;
      top: 0;
      background: var(--paper, #f7fafb);
      color: var(--muted);
      font-weight: 650;
    }

    .hist-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 8px;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .hist-bar button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      border: 0;
      background: transparent;
      padding: 4px 0;
      cursor: pointer;
    }

    #histCompare {
      color: var(--accent-2);
    }

    #histCompare:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #histDelete,
    #histConfirmYes {
      color: var(--bad);
    }

    #histConfirmNo {
      color: var(--muted);
      margin-left: 8px;
    }

    #comparePanel {
      margin: 0 0 12px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    #comparePanel[hidden] {
      display: none;
    }

    .compare-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }

    .compare-head strong {
      font-size: 13px;
      font-weight: 650;
    }

    .compare-head button {
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
    }

    .compare-head button:hover {
      color: var(--ink);
    }

    #compareBody {
      padding: 8px 12px 12px;
      overflow: auto;
    }

    table.compare {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: transparent;
      border: 0;
    }

    table.compare th,
    table.compare td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    table.compare th {
      font-size: 11px;
      font-weight: 650;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
    }

    table.compare th.mono,
    table.compare td.mono {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
    }

    table.compare tr.is-section td {
      padding-top: 12px;
      font-weight: 650;
      color: var(--muted);
      border-bottom: 0;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    table.compare td.is-diff {
      background: rgba(180, 83, 9, 0.1);
      color: var(--warn);
      font-weight: 650;
    }

    #compareMsg {
      margin: 0;
      padding: 0 12px 10px;
    }

    #compareMsg:empty {
      display: none;
    }

    tr.hist-row {
      cursor: pointer;
    }

    td.hist-pick {
      width: 28px;
      cursor: default;
    }

    tr.hist-row.is-open td {
      background: rgba(13, 110, 106, 0.06);
    }

    tr.hist-row.is-observing td {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .hist-report {
      padding: 4px 0 8px;
    }

    .sec-body {
      padding: 0 12px 12px;
      border-top: 1px solid var(--line);
    }

    details.fold {
      margin: 0 0 10px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    details.fold>summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
      user-select: none;
      font-weight: 650;
      font-size: 13px;
      color: var(--ink);
    }

    details.fold>summary::-webkit-details-marker {
      display: none;
    }

    details.fold>summary::before {
      content: "";
      flex: 0 0 auto;
      width: 0;
      height: 0;
      border-left: 5px solid var(--muted);
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      opacity: 0.75;
    }

    details.fold[open]>summary::before {
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--muted);
      border-bottom: 0;
    }

    details.fold .fold-body {
      padding: 0 12px 12px;
      border-top: 1px solid var(--line);
    }

    .control-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 10px;
      flex-wrap: wrap;
    }

    .run-status {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .control-bar:has(#runControls[data-state="running"]) .run-status,
    .control-bar:has(#runControls[data-state="preparing"]) .run-status {
      color: var(--accent-2);
    }

    .control-bar:has(#runControls[data-state="failed"]) .run-status {
      color: var(--bad);
    }

    #telemWarn[hidden] {
      display: none;
    }

    #telemWarn {
      font-size: 12px;
      color: var(--warn);
      font-weight: 600;
    }

    details#monitor>summary.monitor-head {
      margin: 0;
    }

    #monitor>.sec-body {
      padding-top: 10px;
    }

    #monitorContext {
      flex: 1 1 auto;
      min-width: 0;
      margin-left: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
      font-size: 12px;
      font-weight: 500;
    }

    .hist-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 10px;
    }

    .hist-actions button {
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 5px 10px;
      cursor: pointer;
    }

    .hist-actions button:hover {
      background: rgba(13, 110, 106, 0.08);
      border-color: rgba(13, 110, 106, 0.35);
    }

    .timeline {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px 10px;
      margin: 0 0 8px;
    }

    .tl-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tl-actions {
      display: flex;
      align-items: center;
    }

    .tl-actions button {
      border: 0;
      background: transparent;
      color: var(--accent-2);
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      padding: 0 8px;
      cursor: pointer;
    }

    .tl-actions button+button {
      border-left: 1px solid var(--line);
    }

    .tl-actions button:hover {
      color: var(--accent);
    }

    .timeline input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      margin: 8px 0 4px;
      background: transparent;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .timeline input[type="range"]:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .timeline input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent)) 0 / var(--tl-pct, 0%) 100% no-repeat,
        rgba(14, 26, 34, 0.10);
    }

    .timeline input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -4px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #0d6e6a;
      box-shadow: 0 0 0 1px rgba(13, 110, 106, 0.28);
    }

    .timeline input[type="range"]:hover::-webkit-slider-thumb {
      background: #0a5552;
    }

    .timeline input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(14, 26, 34, 0.10);
    }

    .timeline input[type="range"]::-moz-range-progress {
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .timeline input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #0d6e6a;
      box-shadow: 0 0 0 1px rgba(13, 110, 106, 0.28);
    }

    .tl-arms {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    #frameMeta {
      white-space: pre-line;
      margin: 0;
    }

    #frameMeta[hidden] {
      display: none;
    }

    .meter.is-sys[hidden],
    #valSysExtra[hidden] {
      display: none;
    }

    .pipeline {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      background: var(--panel);
      margin: 0 0 8px;
    }

    .pipeline .meter {
      background: transparent;
      border: 0;
      padding: 8px 12px 6px;
    }

    .pipeline .meter+.meter {
      border-top: 1px solid var(--line);
    }

    .pipeline-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin: 0;
      padding: 7px 12px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .scoreboard {
      margin: 0 0 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 14px 14px 12px;
    }

    .score-groups {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .score-group-label {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
      gap: 10px;
    }

    .score-card {
      min-height: 78px;
      padding: 10px 14px 12px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .score-card .k {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
    }

    .score-card .v {
      display: block;
      font-family: "Cascadia Mono", "JetBrains Mono", "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 28px;
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--ink);
    }

    .score-card .u {
      margin-left: 4px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--muted);
    }

    .score-card.is-empty .v {
      color: var(--muted);
    }

    .score-lead {
      border-color: rgba(13, 110, 106, 0.45);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .score-lead .v {
      color: var(--accent-2);
    }

    .scoreboard .quiet {
      margin: 12px 0 0;
    }

    body.in-shell .scoreboard {
      padding: 10px 10px 8px;
    }

    body.in-shell .score-card {
      min-height: 64px;
      padding: 8px 10px;
    }

    body.in-shell .score-card .v {
      font-size: 22px;
    }

    .meter-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .meter-name {
      font-weight: 650;
      font-size: 12px;
      color: var(--muted);
    }

    .meter-value {
      font-variant-numeric: tabular-nums;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 15px;
      white-space: nowrap;
      color: var(--ink);
    }

    body.in-shell .meter-value {
      font-size: 13px;
    }

    .meter-toggle {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .meter-toggle:hover .meter-name {
      color: var(--accent-2);
    }

    .meter-toggle .meter-name::after {
      content: "";
      display: inline-block;
      width: 0;
      height: 0;
      margin-left: 6px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--muted);
      vertical-align: middle;
      opacity: 0.7;
    }

    .meter-toggle[aria-expanded="true"] .meter-name::after {
      border-top: 0;
      border-bottom: 5px solid var(--muted);
    }

    .inv-panel {
      margin: 8px 0 4px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
      max-height: 180px;
      overflow: auto;
    }

    .inv-panel[hidden] {
      display: none;
    }

    .inv-empty {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .inv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      background: transparent;
      border: 0;
    }

    .inv-table th,
    .inv-table td {
      padding: 4px 6px;
      border-bottom: 1px solid rgba(14, 26, 34, 0.08);
      white-space: nowrap;
    }

    .inv-table th {
      color: var(--muted);
      font-weight: 600;
      background: transparent;
    }

    .inv-table tr.is-enhancing td {
      color: var(--warn);
      font-weight: 600;
    }

    canvas.spark {
      width: 100%;
      height: 44px;
      display: block;
    }

    .quiet {
      font-size: 13px;
      color: var(--muted);
    }

    .run-controls {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--line);
      background: var(--panel);
      margin: 0;
    }

    .run-btn {
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 8px 16px;
      cursor: pointer;
      line-height: 1.2;
    }

    .run-btn+.run-btn {
      border-left: 1px solid var(--line);
    }

    .run-btn:hover:not(:disabled) {
      background: rgba(13, 110, 106, 0.08);
    }

    .run-btn:disabled {
      opacity: 0.38;
      cursor: default;
    }

    .run-controls[data-state="idle"] .run-start,
    .run-controls[data-state="stopped"] .run-start,
    .run-controls[data-state="failed"] .run-start {
      background: var(--accent);
      color: #fff;
    }

    .run-controls[data-state="idle"] .run-start:hover:not(:disabled),
    .run-controls[data-state="stopped"] .run-start:hover:not(:disabled),
    .run-controls[data-state="failed"] .run-start:hover:not(:disabled) {
      background: var(--accent-2);
    }

    .run-controls[data-state="running"] .run-start,
    .run-controls[data-state="preparing"] .run-start {
      color: var(--muted);
    }

    .run-controls[data-state="running"] .run-stop,
    .run-controls[data-state="preparing"] .run-stop {
      color: var(--bad);
    }

    .run-controls[data-state="running"] .run-stop:hover:not(:disabled),
    .run-controls[data-state="preparing"] .run-stop:hover:not(:disabled) {
      background: rgba(180, 35, 24, 0.08);
    }

    #runMsg:empty {
      display: none;
    }

    #runMsg {
      margin: 0 0 10px;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 8px;
      padding-top: 10px;
    }

    @media (max-width: 520px) {
      .recipe-grid {
        grid-template-columns: 1fr;
      }
    }

    body.in-shell .recipe-grid {
      grid-template-columns: 1fr;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .field.span-2 {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 11px;
      font-weight: 650;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .field select,
    .field input[type="text"] {
      width: 100%;
      font: inherit;
      font-size: 13px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .field select:disabled,
    .field input:disabled {
      opacity: 0.55;
    }

    .field-hint {
      font-size: 11px;
      color: var(--muted);
    }

    .trace-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
    }

    .trace-tools input[type="search"] {
      flex: 1 1 140px;
      min-width: 0;
      font: inherit;
      font-size: 12px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .trace-tools input[type="search"]:disabled {
      opacity: 0.55;
    }

    .trace-tools button {
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .trace-tools button:hover:not(:disabled) {
      background: rgba(13, 110, 106, 0.08);
    }

    .trace-tools button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    body.in-shell .status-line {
      display: none;
    }

    body.in-shell .shell {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    body.in-shell nav {
      display: none;
    }

    body.in-shell {
      overflow-x: hidden;
    }

    body.in-shell main {
      padding: 8px 10px 14px;
      overflow-x: hidden;
    }

    body.in-shell #panel-experiments>h1 {
      display: none;
    }

    body.in-shell .control-bar {
      margin-bottom: 8px;
    }

    body.in-shell .run-btn {
      padding: 7px 12px;
      font-size: 12px;
    }

    body.in-shell .timeline {
      padding: 8px 10px;
    }

    body.in-shell canvas.spark {
      height: 36px;
    }

    body.in-shell #timeline {
      display: none;
    }

    body.in-shell[data-state="idle"] .scoreboard,
    body.in-shell[data-state="idle"] .monitor-head,
    body.in-shell[data-state="idle"] #pipeline .meter:not(.is-sys),
    body.in-shell[data-state="idle"] #valRebuffer {
      display: none;
    }

    body.in-shell[data-state="idle"] details#monitor {
      border: 0;
      background: transparent;
    }

    body.in-shell[data-state="idle"] details#monitor>.sec-body {
      padding: 0;
      border-top: 0;
    }
  </style>
</head>

<body>
  <div class="shell">
    <nav>
      <p class="brand">Prism<span>.</span></p>
      <button type="button" class="nav-btn active" data-panel="experiments">实验</button>
    </nav>
    <main>
      <div class="status-line">
        <span class="dot" id="dot"></span>
        <span id="conn">检查控制面…</span>
      </div>

      <section class="panel active" id="panel-experiments">
        <h1>实验</h1>

        <!-- A. 控制条 -->
        <div class="control-bar">
          <div class="run-controls" id="runControls" data-state="idle">
            <button type="button" class="run-btn run-start" id="btnStartRun">开始</button>
            <button type="button" class="run-btn run-stop" id="btnStopRun" disabled>停止</button>
          </div>
          <span class="run-status" id="runStatus" title="">就绪</span>
          <span id="telemWarn" hidden>遥测暂时中断</span>
        </div>
        <div id="runMsg"></div>

        <!-- B. 配方 -->
        <details class="sec" id="recipePanel" open>
          <summary>
            <span class="sec-row">
              <span class="sec-title" id="recipeTitle">配方</span>
            </span>
          </summary>
          <div class="sec-body">
            <div class="recipe-grid">
              <div class="field span-2">
                <label for="fldWorkspace">工作区</label>
                <select id="fldWorkspace"></select>
                <span class="field-hint" id="workspaceHint" hidden></span>
              </div>
              <div class="field span-2">
                <label for="fldContent">内容</label>
                <select id="fldContent"></select>
              </div>
              <div class="field">
                <label for="fldNes">调度 / 增强策略</label>
                <select id="fldNes"></select>
              </div>
              <div class="field">
                <label for="fldEnhancer">增强器</label>
                <select id="fldEnhancer"></select>
              </div>
              <div class="field">
                <label for="fldNetMode">网络</label>
                <select id="fldNetMode">
                  <option value="none">不模拟（TCP）</option>
                  <option value="trace">轨迹限速</option>
                </select>
              </div>
              <div class="field">
                <label for="fldRenderer">渲染</label>
                <select id="fldRenderer"></select>
              </div>
              <div class="field" id="fldTraceDatasetWrap" hidden>
                <label for="fldTraceDataset">网络数据集</label>
                <select id="fldTraceDataset" disabled></select>
              </div>
              <div class="field span-2" id="fldTraceFileWrap" hidden>
                <label for="fldTraceFile">轨迹文件</label>
                <select id="fldTraceFile" disabled></select>
                <div class="trace-tools">
                  <input type="search" id="fldTraceSearch" placeholder="搜索文件名…" disabled autocomplete="off" />
                  <button type="button" id="btnTraceRandom" disabled>随机一条</button>
                </div>
                <span class="field-hint" id="traceHint"></span>
              </div>
            </div>
          </div>
        </details>

        <!-- C. 观测 -->
        <details class="sec" id="monitor" open>
          <summary class="monitor-head">
            <span class="sec-row">
              <span class="sec-title">观测</span>
              <span class="quiet" id="monitorContext" title=""></span>
            </span>
          </summary>
          <div class="sec-body">

            <section class="scoreboard" aria-label="本次指标" hidden>
              <div id="qualityFoot"></div>
              <p class="quiet" id="qualityNote" hidden></p>
              <div class="report" id="playbackReport" hidden></div>
            </section>

            <div class="timeline" id="timeline">
              <div class="tl-top">
                <span class="quiet">时间轴</span>
                <div class="tl-actions">
                  <button type="button" id="btnLive">直播</button>
                  <button type="button" id="btnKeepFrames" title="把当前内存中的帧归档到磁盘，便于事后回看">保留</button>
                </div>
              </div>
              <input id="frameSlider" type="range" min="0" max="0" value="0" disabled />
              <p class="quiet" id="frameMeta" hidden>—</p>
            </div>

            <div class="pipeline" id="pipeline">
              <div class="meter is-dup">
                <div class="meter-head"><span class="meter-name">下载缓冲</span><b class="meter-value" id="valDown">—</b>
                </div>
                <canvas class="spark" id="chartDown" width="480" height="64"></canvas>
              </div>
              <div class="meter">
                <button type="button" class="meter-toggle" id="btnPendingInv" aria-expanded="false">
                  <span class="meter-name">待增强</span>
                  <b class="meter-value" id="valPending">—</b>
                </button>
                <div class="inv-panel" id="invPending" hidden></div>
                <canvas class="spark" id="chartPending" width="480" height="64"></canvas>
              </div>
              <div class="meter">
                <button type="button" class="meter-toggle" id="btnReadyInv" aria-expanded="false">
                  <span class="meter-name">已增强就绪</span>
                  <b class="meter-value" id="valReady">—</b>
                </button>
                <div class="inv-panel" id="invReady" hidden></div>
                <canvas class="spark" id="chartReady" width="480" height="64"></canvas>
              </div>
              <div class="meter is-dup">
                <div class="meter-head"><span class="meter-name">下载带宽</span><b class="meter-value" id="valBw">—</b>
                </div>
                <canvas class="spark" id="chartBw" width="480" height="64"></canvas>
              </div>
              <div class="meter is-sys" id="meterCpu">
                <div class="meter-head"><span class="meter-name">CPU</span><b class="meter-value" id="valCpu">—</b>
                </div>
                <canvas class="spark" id="chartCpu" width="480" height="64"></canvas>
              </div>
              <div class="meter is-sys" id="meterGpu">
                <div class="meter-head"><span class="meter-name">GPU</span><b class="meter-value" id="valGpu">—</b>
                </div>
                <canvas class="spark" id="chartGpu" width="480" height="64"></canvas>
              </div>
              <div class="pipeline-foot">
                <span id="valRebuffer">重缓冲 —</span>
                <span id="valSysExtra">整机 CPU —</span>
              </div>
            </div>
          </div>
        </details>

        <!-- D. 历史 -->
        <details class="sec" id="historyPanel">
          <summary>
            <span class="sec-row">
              <span class="sec-title">历史</span>
            </span>
          </summary>
          <div class="sec-body">
            <div class="hist-bar" id="histBar" hidden>
              <span id="histCount">已选 0 项</span>
              <button type="button" id="histCompare" disabled title="请选 2～4 项">对比</button>
              <button type="button" id="histDelete">删除所选</button>
              <span id="histConfirm" hidden>
                <span id="histConfirmText"></span>
                <button type="button" id="histConfirmYes">确认删除</button>
                <button type="button" id="histConfirmNo">取消</button>
              </span>
              <span class="quiet" id="histMsg"></span>
            </div>
            <div id="comparePanel" hidden>
              <div class="compare-head">
                <strong>对比</strong>
                <button type="button" id="compareClose">关闭</button>
              </div>
              <div id="compareBody"></div>
              <p class="quiet" id="compareMsg"></p>
            </div>
            <div id="runList"></div>
          </div>
        </details>
      </section>

    </main>
  </div>
  <dialog id="segmentDialog">
    <div class="seg-head">
      <strong>分段明细</strong>
      <span class="quiet" id="segmentCount"></span>
      <button type="button" id="segmentClose">关闭</button>
    </div>
    <div class="seg-filters">
      <button type="button" data-seg-filter="all" class="is-on">全部</button>
      <button type="button" data-seg-filter="abort">只看中止</button>
      <button type="button" data-seg-filter="fast">只看 fast-complete</button>
      <button type="button" data-seg-filter="incomplete">只看未完成</button>
    </div>
    <div class="seg-scroll" id="segmentTable"></div>
  </dialog>
  <script src="/lab/static/metrics.js"></script>
  <script>
    const API = "/v1";
    const M = globalThis.PrismLabMetrics || {};
    const IN_SHELL = new URLSearchParams(location.search).get("shell") === "1";
    const $ = (id) => document.getElementById(id);
    if (IN_SHELL) {
      document.body.classList.add("in-shell");
      document.body.dataset.state = document.body.dataset.state || "idle";
      document.querySelectorAll(".nav-btn[data-panel]").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      document.querySelector('[data-panel="experiments"]').classList.add("active");
      document.getElementById("panel-experiments").classList.add("active");
    }

    function setConn(ok, text) {
      $("dot").className = "dot" + (ok ? " ok" : " bad");
      const conn = $("conn");
      const line = document.querySelector(".status-line");
      if (conn) {
        conn.textContent = ok ? "" : String(text || "控制面不可用");
        conn.hidden = !!ok;
      }
      if (line) line.classList.toggle("is-ok", !!ok);
    }

    function setFrameMeta(text, title) {
      const meta = $("frameMeta");
      if (!meta) return;
      const t = text == null ? "" : String(text).trim();
      const empty = !t || t === "—";
      meta.textContent = empty ? "—" : t;
      meta.hidden = empty;
      meta.title = title || (empty ? "" : t);
    }

    function setSysMetersVisible(_on) {
      if ($("meterCpu")) $("meterCpu").hidden = false;
      if ($("meterGpu")) $("meterGpu").hidden = false;
      if ($("valSysExtra")) $("valSysExtra").hidden = false;
    }

    async function api(path, opts) {
      const res = await fetch(API + path, opts);
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
      if (!res.ok) {
        const err = new Error((data && data.detail) || res.statusText || "request failed");
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    let currentRunId = null;
    let currentRunSpec = null;
    let currentRunCollectSys = false;
    let lastStartedSpec = null;
    let telemetryFailStreak = 0;
    let telemetryTimer = null;
    let telemetryInFlight = false;
    let sparkRunId = null;
    let sparkSamples = [];
    let sparkFullLoaded = false;
    let sparkSealed = false;
    let sparkLoad = null;
    let qualityMetrics = null;
    let qualityRunId = null;
    let qualityInflight = null;
    let lastFrameCount = -1;
    let timeline = { runId: null, armId: null, arms: [], totals: {}, storage: "", timer: null };

    function drawSpark(canvasId, values, color) {
      const c = $(canvasId);
      if (!c) return;
      const ctx = c.getContext("2d");
      const w = c.width, h = c.height;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(14,26,34,0.08)";
      ctx.beginPath();
      ctx.moveTo(0, h - 0.5);
      ctx.lineTo(w, h - 0.5);
      ctx.stroke();
      if (!values.length) return;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = (max - min) || 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      values.forEach((v, i) => {
        const x = (i / Math.max(values.length - 1, 1)) * (w - 4) + 2;
        const y = h - 4 - ((v - min) / span) * (h - 8);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function renderInventory(panelId, rows, kind) {
      const panel = $(panelId);
      if (!panel) return;
      const list = Array.isArray(rows) ? rows : [];
      const head = kind === "ready"
        ? "<tr><th>#</th><th>级别</th><th>耗时</th><th>模型</th></tr>"
        : "<tr><th>#</th><th>级别</th><th>状态</th><th>模型</th></tr>";
      const body = list.map((row) => {
        const cls = row.status === "enhancing" ? ' class="is-enhancing"' : "";
        if (kind === "ready") {
          return `<tr${cls}><td>${row.index ?? "—"}</td><td>${row.enhance_level == null ? "—" : row.enhance_level}</td><td>${M.fmtInvNum(row.enhance_latency_s, 2)}s</td><td>${row.model || "—"}</td></tr>`;
        }
        return `<tr${cls}><td>${row.index ?? "—"}</td><td>${row.enhance_level == null ? "—" : row.enhance_level}</td><td>${M.statusLabel(row.status)}</td><td>${row.model || "—"}</td></tr>`;
      }).join("");
      panel.innerHTML = `<table class="inv-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
    }

    function bindInventoryToggle(btnId, panelId) {
      const btn = $(btnId);
      const panel = $(panelId);
      if (!btn || !panel || btn.dataset.bound === "1") return;
      btn.dataset.bound = "1";
      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", open ? "false" : "true");
        panel.hidden = open;
      });
    }

    async function loadFinalMetrics(runId) {
      if (!runId) return qualityMetrics;
      if (qualityRunId === runId && qualityMetrics) return qualityMetrics;
      if (qualityInflight && qualityInflight.id === runId) return qualityInflight.promise;
      const promise = api(`/runs/${runId}/metrics`).then((metrics) => {
        if (currentRunId !== runId) return metrics;
        qualityRunId = runId;
        qualityMetrics = metrics;
        return metrics;
      }).finally(() => {
        if (qualityInflight && qualityInflight.promise === promise) qualityInflight = null;
      });
      qualityInflight = { id: runId, promise };
      return promise;
    }

    function drawSparks(samples) {
      const rows = samples || [];
      drawSpark("chartDown", rows.map((s) => Number(s.download_buffer_s || 0)), "#0d6e6a");
      drawSpark(
        "chartReady",
        rows.map((s) => Number(s.enhanced_ready_s != null ? s.enhanced_ready_s : 0)),
        "#0a5552",
      );
      drawSpark(
        "chartPending",
        rows.map((s) => Number(M.pendingEnhanceS(s) || 0)),
        "#b45309",
      );
      drawSpark("chartBw", rows.map((s) => Number(s.bandwidth_bps || 0) / 1e6), "#5a6b76");
      drawSpark("chartCpu", rows.map((s) => Number(s.cpu_pct != null ? s.cpu_pct : 0)), "#0d6e6a");
      drawSpark("chartGpu", rows.map((s) => Number(s.gpu_util_pct != null ? s.gpu_util_pct : 0)), "#b45309");
    }

    function clearSparks() {
      sparkRunId = null;
      sparkSamples = [];
      sparkFullLoaded = false;
      sparkSealed = false;
      sparkLoad = null;
      drawSparks([]);
    }

    function adoptSparkRun(runId) {
      if (sparkRunId === runId) return;
      sparkRunId = runId;
      sparkSamples = [];
      sparkFullLoaded = false;
      sparkSealed = false;
      sparkLoad = null;
    }

    function mergeSparkSamples(rows) {
      if (!rows || !rows.length) return;
      const seen = new Set(sparkSamples.map((row) => row && row.ts));
      let added = false;
      for (const row of rows) {
        if (!row || row.ts == null || seen.has(row.ts)) continue;
        seen.add(row.ts);
        sparkSamples.push(row);
        added = true;
      }
      if (added) sparkSamples.sort((a, b) => Number(a.ts) - Number(b.ts));
    }

    async function loadFullSparks(runId, armId, seal) {
      if (!runId) return;
      adoptSparkRun(runId);
      if (seal && sparkSealed) return;
      if (!seal && sparkFullLoaded) return;
      if (sparkLoad) return sparkLoad;
      const q = armId ? `?arm_id=${encodeURIComponent(armId)}&limit=0` : "?limit=0";
      sparkLoad = api(`/runs/${runId}/telemetry${q}`).then((page) => {
        if (sparkRunId !== runId) return;
        const series = (page && page.series) || {};
        const rows = (armId && series[armId]) || series[Object.keys(series)[0]] || [];
        const extra = sparkSamples.slice();
        sparkSamples = [];
        mergeSparkSamples(rows);
        mergeSparkSamples(extra);
        sparkFullLoaded = true;
        if (seal) sparkSealed = true;
        drawSparks(sparkSamples);
      }).finally(() => {
        sparkLoad = null;
      });
      return sparkLoad;
    }

    async function refreshTelemetry() {
      if (!currentRunId || telemetryInFlight) return;
      telemetryInFlight = true;
      try {
        const wasLive = currentControlsLive();
        const live = await api(`/runs/${currentRunId}/live?limit=120`);
        setRunControls(live.status || "idle");
        const running = live.status === "running" || live.status === "preparing";
        if (!running) setTelemetryPolling(false);
        // Natural end-of-play never hits Stop; refresh history once on that edge
        // so the row leaves「运行中」and picks up rebuffer / bandwidth / QoE.
        if (wasLive && !running) {
          try {
            const runs = await api("/runs");
            renderHistory(runs);
          } catch (e) { /* history can lag independently of live */ }
        }
        const armId = live.arm_id || live.active_arm_id || (live.arms && live.arms[0] && live.arms[0].id);
        const samples = live.samples || [];
        const last = samples.length ? samples[samples.length - 1] : null;
        const readyInv = (last && Array.isArray(last.enhanced_ready_inventory)) ? last.enhanced_ready_inventory : [];
        const pendingInv = (last && Array.isArray(last.enhance_pending_inventory)) ? last.enhance_pending_inventory : [];
        $("valDown").textContent = M.formatSeconds(last ? Number(last.download_buffer_s || 0) : null);
        $("valReady").textContent = M.formatSeconds(
          last && last.enhanced_ready_s != null ? Number(last.enhanced_ready_s) : null,
        );
        $("valPending").textContent = M.formatSeconds(last ? M.pendingEnhanceS(last) : null);
        $("valBw").textContent = M.formatBwMbps(last ? last.bandwidth_bps : null);
        renderInventory("invReady", readyInv, "ready");
        renderInventory("invPending", pendingInv, "pending");
        adoptSparkRun(currentRunId);
        mergeSparkSamples(samples);
        drawSparks(sparkSamples);
        if (!running && !sparkSealed) loadFullSparks(currentRunId, armId, true).catch(() => { });
        else if (!sparkFullLoaded) loadFullSparks(currentRunId, armId).catch(() => { });
        const summary = live.summary || {};
        setSysMetersVisible(currentRunCollectSys);
        if (currentRunCollectSys) {
          $("valCpu").textContent = M.formatCpuLine(last);
          $("valCpu").title = M.formatCpuTitle ? M.formatCpuTitle() : "CPU：进程算力% · 进程内存占整机% · RSS";
          $("valGpu").textContent = M.formatGpuLine(last);
          $("valGpu").title = M.formatGpuTitle(last);
          $("valSysExtra").textContent = M.formatSysExtra(last);
        }
        const rebuffer = summary.rebuffer_s != null ? Number(summary.rebuffer_s) : null;
        $("valRebuffer").textContent = M.formatRebuffer(rebuffer);
        let metrics = qualityMetrics;
        if (!running) {
          try {
            metrics = await loadFinalMetrics(currentRunId);
          } catch (e) { /* bundle can fail independently of live */ }
          loadPlaybackReport(currentRunId);
        } else if (!metrics) {
          metrics = { arms: {}, cards: live.cards || [], workspace: live.workspace };
        }
        const arms = (metrics && metrics.arms) || {};
        const first = (armId && arms[armId]) || arms[Object.keys(arms)[0]] || summary;
        renderQualityCards(metrics, armId, first, { pendingFinal: running });
        const frames = Number(live.frame_count || 0);
        if (frames !== lastFrameCount) {
          lastFrameCount = frames;
          if (armId) {
            timeline.totals[armId] = frames;
            timeline.storage = "current";
          }
          refreshTimeline(live, { skipFetch: frames >= 0 });
        }
        telemetryFailStreak = 0;
        setTelemWarn(false);
      } catch (e) {
        telemetryFailStreak += 1;
        if (telemetryFailStreak >= 3) setTelemWarn(true, e && e.message);
      } finally {
        telemetryInFlight = false;
      }
    }

    function renderQualityCards(metrics, armId, first, opts) {
      const foot = $("qualityFoot");
      if (!foot) return;
      const board = scoreboardEl();
      const note = $("qualityNote");
      if (opts && opts.pendingFinal) {
        foot.innerHTML = "";
        if (note) {
          note.textContent = "";
          note.hidden = true;
        }
        setScoreboardVisible(false);
        return;
      }
      const arms = (metrics && metrics.arms) || {};
      const armMetrics = (armId && arms[armId]) || first;
      const cards = (metrics && metrics.cards && metrics.cards.length) ? metrics.cards : [
        { key: "qoe", label: "QoE", digits: 2, group: "播放质量", hint: "平均画质减去振荡，再减去卡顿" },
        { key: "avg_vmaf", label: "VMAF", digits: 2, group: "播放质量", hint: "已评分段的平均画质" },
        { key: "oscillation_vmaf", label: "振荡", digits: 2, group: "播放质量", hint: "相邻段画质差的平均" },
        { key: "avg_freeze", label: "均卡顿", digits: 2, suffix: " s", group: "播放质量", hint: "总卡顿秒数除以播放段数" },
      ];
      const groups = M.groupCards ? M.groupCards(cards) : [{ name: "播放质量", cards: cards }];
      const showGroupLabel = groups.length > 1;
      // Idle / cleared: keep the board out of the way.
      if (!armMetrics && !metrics) {
        foot.innerHTML = "";
        if (note) {
          note.textContent = "";
          note.hidden = true;
        }
        setScoreboardVisible(false);
        return;
      }
      const hasAnyValue = cards.some((card) => {
        const value = armMetrics ? armMetrics[card.key] : null;
        if (value == null || value === "") return false;
        return !(typeof value === "number" && Number.isNaN(value));
      });
      foot.innerHTML = `<div class="score-groups">${groups.map((group) => {
        const cells = group.cards.map((card) => {
          const value = armMetrics ? armMetrics[card.key] : null;
          const parts = M.formatCardParts
            ? M.formatCardParts(card, value)
            : { label: card.label || card.key, value: "—", suffix: "", empty: true };
          const lead = card.key === "qoe" ? " score-lead" : "";
          const empty = parts.empty ? " is-empty" : "";
          const hint = card.hint ? ` title="${esc(card.hint)}"` : "";
          const unit = parts.suffix ? `<span class="u">${esc(String(parts.suffix).trim())}</span>` : "";
          return `<article class="score-card${lead}${empty}"${hint}><span class="k">${esc(parts.label)}</span><span class="v">${esc(parts.value)}${unit}</span></article>`;
        }).join("");
        const label = showGroupLabel
          ? `<h2 class="score-group-label">${esc(group.name)}</h2>`
          : "";
        return `<section class="score-group">${label}<div class="score-grid">${cells}</div></section>`;
      }).join("")}</div>`;
      setScoreboardVisible(true);
      if (!note) return;
      let noteText = "";
      const reason = armMetrics && armMetrics.metrics_reason;
      const status = armMetrics && armMetrics.metrics_status;
      const qSrc = metrics && metrics.provenance && metrics.provenance.quality_source;
      if (status === "unavailable" || qSrc === "unavailable") {
        noteText = reason || "画质指标不可用（质量表缺失或未评分）";
      } else if (reason) {
        noteText = reason;
      } else if (!hasAnyValue) {
        noteText = "正在汇总指标…";
      }
      note.textContent = noteText;
      note.hidden = !noteText;
    }

    function frameLine(row) {
      if (!row) return "—";
      const level = row.enhance_level == null ? "—" : row.enhance_level;
      const enhanced = row.enhanced ? "已增强" : "未增强";
      const model = row.model ? ` · ${row.model}` : "";
      const scale = row.scale ? ` · ${row.scale}` : "";
      const vmaf = row.vmaf == null || Number.isNaN(Number(row.vmaf)) ? "" : ` · VMAF ${Number(row.vmaf).toFixed(1)}`;
      return `#${row.frame} · 段 ${row.segment} · ${row.representation} · 增强 ${level} · ${enhanced}${model}${scale}${vmaf}`;
    }

    function paintTimelineTrack(slider) {
      if (!slider) return;
      const max = Number(slider.max) || 0;
      const val = Number(slider.value) || 0;
      const pct = max > 0 ? Math.max(0, Math.min(100, (val / max) * 100)) : 0;
      slider.style.setProperty("--tl-pct", pct.toFixed(2) + "%");
    }

    async function refreshTimeline(run, opts) {
      const slider = $("frameSlider");
      if (!slider) return;
      if (!run) {
        timeline = { runId: null, armId: null, arms: [], totals: {}, storage: "", timer: timeline.timer };
        lastFrameCount = -1;
        slider.disabled = true;
        slider.value = "0";
        slider.max = "0";
        paintTimelineTrack(slider);
        setFrameMeta("");
        return;
      }
      const arms = (run.arms || []).map((arm) => arm.id);
      const same = timeline.runId === run.id && arms.join() === timeline.arms.join();
      if (!same) {
        timeline.runId = run.id;
        timeline.arms = arms;
        timeline.armId = timeline.armId && arms.includes(timeline.armId) ? timeline.armId : (arms[0] || null);
        timeline.totals = {};
      }
      const skipFetch = opts && opts.skipFetch && timeline.runId === run.id;
      let max = 0;
      if (skipFetch) {
        for (const id of arms) max = Math.max(max, timeline.totals[id] || 0);
        if (typeof run.frame_count === "number" && timeline.armId) {
          timeline.totals[timeline.armId] = run.frame_count;
          max = Math.max(max, run.frame_count);
        }
      } else {
        for (const id of arms) {
          try {
            const page = await api(`/runs/${run.id}/frames?arm_id=${encodeURIComponent(id)}&limit=1`);
            timeline.totals[id] = page.total || 0;
            timeline.storage = page.storage || "";
            max = Math.max(max, timeline.totals[id]);
          } catch (e) { /* archive may still be empty */ }
        }
      }
      const last = Math.max(0, max - 1);
      slider.max = String(last);
      slider.disabled = max < 1;
      if (!timeline.scrubbing && Number(slider.value) > last) slider.value = String(last);
      paintTimelineTrack(slider);
      if (max < 1) setFrameMeta("");
      else if (!timeline.holding && !timeline.scrubbing) setFrameMeta(max + " 帧");
    }

    async function scrubTo(frame) {
      if (!timeline.runId || !timeline.armId) return;
      timeline.scrubbing = true;
      const total = timeline.totals[timeline.armId] || 0;
      let line = "无此帧";
      if (frame < total) {
        try {
          const row = await api(`/runs/${timeline.runId}/frames/${frame}?arm_id=${encodeURIComponent(timeline.armId)}`);
          line = frameLine(row);
        } catch (e) {
          line = "无此帧";
        }
      }
      timeline.holding = true;
      setFrameMeta(line);
      if (frame < total) {
        await api("/system/picture", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ run_id: timeline.runId, arm_id: timeline.armId, frame }),
        });
      }
      timeline.scrubbing = false;
    }

    function parseTracePath(path) {
      const m = String(path || "").replace(/\\/g, "/").match(/(?:^|\/)data\/([^/]+)\/(.+)$/);
      if (!m) return { dataset: "", file: "" };
      return { dataset: m[1], file: m[2] };
    }

    async function loadTraceFiles(dataset, preferPath, qOverride) {
      const sel = $("fldTraceFile");
      const hint = $("traceHint");
      if (!dataset) {
        sel.innerHTML = "";
        hint.textContent = "";
        return;
      }
      let q = qOverride != null ? String(qOverride) : ($("fldTraceSearch").value || "").trim();
      // Ensure a preferred path appears even if outside the first page.
      if (preferPath && !q) {
        const parsed = parseTracePath(preferPath);
        if (parsed.file) q = parsed.file;
      }
      let url = `/specs/traces?dataset=${encodeURIComponent(dataset)}&limit=80`;
      if (q) url += `&q=${encodeURIComponent(q)}`;
      let data = await api(url);
      let items = data.items || [];
      if (preferPath && !items.some((it) => it.path === preferPath)) {
        const parsed = parseTracePath(preferPath);
        if (parsed.file) {
          const one = await api(
            `/specs/traces?dataset=${encodeURIComponent(dataset)}&limit=5&q=${encodeURIComponent(parsed.file)}`
          );
          const hit = (one.items || []).find((it) => it.path === preferPath) || (one.items || [])[0];
          if (hit) items = [hit, ...items.filter((it) => it.path !== hit.path)];
          data = { ...data, total: one.total != null ? one.total : data.total };
        }
      }
      fillSelect(sel, items, "path", "label");
      const shown = items.length;
      const total = data.total || 0;
      const qNote = q ? ` · 过滤「${q}」` : "";
      hint.textContent = total
        ? (total > shown ? `共 ${total} 条，下列 ${shown} 条${qNote}` : `${total} 条${qNote}`)
        : (q ? `无匹配「${q}」` : "该数据集无轨迹");
      if (preferPath && [...sel.options].some((o) => o.value === preferPath)) {
        sel.value = preferPath;
      } else if (sel.options.length) {
        sel.selectedIndex = 0;
      }
    }

      if (!dataset) throw new Error("请先选择网络数据集");
      const q = ($("fldTraceSearch").value || "").trim();
      let url = `/specs/traces?dataset=${encodeURIComponent(dataset)}&random=1`;
      if (q) url += `&q=${encodeURIComponent(q)}`;
      const data = await api(url);
      const item = (data.items || [])[0];
      if (!item) throw new Error(q ? `过滤「${q}」下没有轨迹` : "该数据集无轨迹");
      await loadTraceFiles(dataset, item.path, q);
      onRecipeFormChange();
      return item;
    }

    async function applySpecToForm(spec) {
      suppressFormSync = true;

        const body = (spec && spec.spec && typeof spec.spec === "object") ? spec.spec : (spec || {});
        const wsId = String(body.workspace || "").trim();
        if (wsId && $("fldWorkspace") && [...$("fldWorkspace").options].some((o) => o.value === wsId)) {
          // Set workspace without applyWorkspaceDefaults — keep player fields from this spec.
          $("fldWorkspace").value = wsId;

        const src = (body.content && body.content.source) || "";

          const opt = document.createElement("option");
          opt.value = src;

        if (src) $("fldContent").value = src;

        const enhancerId = p.mod_enhancer === "imdn_always" ? "imdn" : p.mod_enhancer;
        if (enhancerId && [...$("fldEnhancer").options].some((o) => o.value === enhancerId)) {
          $("fldEnhancer").value = enhancerId;
        }
        if (p.mod_renderer && [...$("fldRenderer").options].some((o) => o.value === p.mod_renderer)) {
          $("fldRenderer").value = p.mod_renderer;
        }
        const trace = (p.trace || "").trim();
        if (trace || p.mod_downloader === "trace") {
          $("fldNetMode").value = "trace";
          setTraceControlsEnabled(true);
          const parsed = parseTracePath(trace);
          const ds = parsed.dataset || ($("fldTraceDataset").options[0] && $("fldTraceDataset").options[0].value) || "";
          if (ds) {
            $("fldTraceDataset").value = ds;
            $("fldTraceSearch").value = "";
            await loadTraceFiles(ds, trace || undefined, "");
          }
        } else {
          $("fldNetMode").value = "none";
          setTraceControlsEnabled(false);
          $("fldTraceSearch").value = "";
          $("traceHint").textContent = "";
        }
      } finally {
        suppressFormSync = false;
        updateWorkspaceHint();
      }
    }

    async function ensureRecipeOptions() {
      if (recipeOpts) return recipeOpts;
      recipeOpts = await api("/specs/options");
      fillSelect($("fldNes"), recipeOpts.nes, "id", "label");
      fillSelect($("fldEnhancer"), recipeOpts.enhancer, "id", "label");
      fillSelect($("fldRenderer"), recipeOpts.renderer, "id", "label");
      fillSelect($("fldTraceDataset"), recipeOpts.trace_datasets || [], "id", "id");
      try {
        const payload = await api("/workspaces");
        workspaces = payload.workspaces || [];
      } catch (e) {
        workspaces = [];
      }
      fillSelect($("fldWorkspace"), workspaces.map((ws) => ({ id: ws.id, label: ws.label || ws.id })), "id", "label");
      if ([...($("fldWorkspace").options || [])].some((opt) => opt.value === "baseline")) {

    const REPORT_LABELS = {

    function reportValue(value) {
      if (value == null || value === "") return "—";
      if (typeof value === "number") {
        return Number.isInteger(value) ? String(value) : String(Math.round(value * 1000) / 1000);
      }
      if (typeof value === "boolean") return value ? "开" : "关";
      return String(value);
    }

    function reportTable(title, rows) {
      if (!rows.length) return "";
      const body = rows.map((row) => `<tr><td>${esc(row[0])}</td><td>${esc(row[1])}</td></tr>`).join("");
      return `<h2>${esc(title)}</h2><table><tbody>${body}</tbody></table>`;
    }

    /** Analyzer tables wrapped in one collapsed block (整块一键展开). */
    function reportHtml(report, opts) {
      if (!report || !report.available) {
        return `<p class="quiet">这次运行没有留下指标</p>`;
      }
      const summary = report.summary || {};
      const summaryRows = Object.keys(REPORT_LABELS)
        .filter((key) => summary[key] != null)
        .map((key) => [REPORT_LABELS[key], reportValue(summary[key])]);
      const startup = Object.entries(report.startup || {}).filter(([, value]) => value != null).map(([key, value]) => [REPORT_LABELS[key] || key, reportValue(value)]);
      const gpu = Object.entries(report.gpu || {}).filter(([, value]) => value != null).map(([key, value]) => [REPORT_LABELS[key] || key, reportValue(value)]);
      const aborts = Object.entries(report.abort_reasons || {}).map(([key, value]) => [key, reportValue(value)]);
      const levels = (report.enhance_levels || []).map((row) => [
        "级别 " + row.level,
        `用了 ${reportValue(row.count)} 段，完成 ${reportValue(row.completed)}，完成率 ${reportValue(row.completion_rate)}，延迟 ${reportValue(row.avg_latency)} s，FPS ${reportValue(row.avg_fps)}`,
      ]);
      const segmentId = stashSegments(report.segments);
      const blocks = [
        ["整段结果", summaryRows],
        ["启动", startup],
        ["增强级别", levels],
        ["中止原因", aborts],
        ["GPU", gpu],
      ];
      const present = blocks.filter(([, rows]) => rows.length);
      const body = present.map(([title, rows]) => reportTable(title, rows)).join("");
      const title = report.file ? `播放器分析 · ${report.file}` : "这次运行的指标";
      const missingFile = !report.file
        ? `<p class="quiet">增强级别、中止原因、启动时间和 GPU 显存还没有写进这次运行。</p>`
        : "";
      if (!body && !missingFile) {
        return `<p class="quiet">${esc(title)}</p><p class="quiet">没有可展示的明细</p>`;
      }
      const openAttr = opts && opts.open ? " open" : "";
      const openSegments = segmentId
        ? `<p><button type="button" class="seg-open" data-segments="${esc(segmentId)}">查看分段</button></p>`
        : "";
      return `<details class="sec report-fold"${openAttr}>`
        + `<summary><span class="sec-row"><span class="sec-title">详细分析</span></span></summary>`
        + `<div class="sec-body report"><p class="quiet">${esc(title)}</p>${openSegments}${body}${missingFile}</div>`
        + `</details>`;
    }

    const segmentViews = {};
    let segmentViewSeq = 0;
    let segmentFilter = "all";
    let segmentActiveId = "";

    function stashSegments(rows) {
      const list = Array.isArray(rows) ? rows : [];
      if (!list.length) return "";
      const id = "seg" + (++segmentViewSeq);
      segmentViews[id] = list;
      return id;
    }

    const ABORT_LABELS = {
      "Remaining time less than min threshold": "剩余时间不足",
      "Already played before enhance": "播放前已过",
      "Already played in enhance": "增强中已开始播放",
      "Max resolution": "已是最高分辨率",
      "UnknownReason": "原因未记录",
    };

    function segmentNum(value, digits) {
      if (value == null || value === "" || Number.isNaN(Number(value))) return "—";
      const n = Number(value);
      if (digits == null) return Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000);
      return n.toFixed(digits);
    }

    function segmentResult(row) {
      if (row && row.abort_reason) return ABORT_LABELS[row.abort_reason] || String(row.abort_reason);
      if (row && row.fast_complete) return "fast-complete";
      if (row && row.is_enhance) return "完成";
      if (row && row.enhance_action === 0) return "不增强";
      return "未完成";
    }

    function segmentVisible(row, filter) {
      if (filter === "abort") return !!(row && row.abort_reason);
      if (filter === "fast") return !!(row && row.fast_complete);
      if (filter === "incomplete") return !!(row && Number(row.enhance_action) > 0 && !row.is_enhance);
      return true;
    }

    function renderSegmentTable() {
      const host = $("segmentTable");
      const count = $("segmentCount");
      const rows = segmentViews[segmentActiveId] || [];
      const shown = rows.filter((row) => segmentVisible(row, segmentFilter));
      if (count) count.textContent = shown.length + " / " + rows.length + " 段";
      if (!host) return;
      const body = shown.map((row) => `<tr>`
        + `<td>${esc(segmentNum(row.index))}</td>`
        + `<td>${esc(segmentNum(row.download_action))}</td>`
        + `<td>${esc(segmentNum(row.enhance_action))}</td>`
        + `<td>${esc(segmentResult(row))}</td>`
        + `<td>${esc(segmentNum(row.enhanced_cnt))} / ${esc(segmentNum(row.interpolated_cnt))}</td>`
        + `<td>${esc(segmentNum(row.enhance_latency, 3))}</td>`
        + `<td>${esc(segmentNum(row.real_vmaf, 1))}</td>`
        + `<td>${esc(segmentNum(row.quality_drop_due_to_fast, 2))}</td>`
        + `<td>${esc(segmentNum(row.enhance_start_to_play_time, 2))}</td>`
        + `<td>${esc(segmentNum(row.enhance_end_to_play_time, 2))}</td>`
        + `<td>${esc(segmentNum(row.fast_complete_threshold, 2))}</td>`
        + `</tr>`).join("");
      const empty = shown.length ? "" : `<tr><td colspan="11">没有符合的段</td></tr>`;
      host.innerHTML = `<table class="seg-table"><thead><tr>`
        + `<th>段</th><th>码率档</th><th>级别</th><th>结果</th><th>增强帧 / 未跑</th><th>延迟 s</th><th>VMAF</th><th>质量下降</th>`
        + `<th>开始时剩余</th><th>结束时剩余</th><th>阈值</th>`
        + `</tr></thead><tbody>${body}${empty}</tbody></table>`;
    }

    function openSegmentDialog(id) {
      const dialog = $("segmentDialog");
      if (!dialog || !segmentViews[id]) return;
      segmentActiveId = id;
      segmentFilter = "all";
      document.querySelectorAll("#segmentDialog [data-seg-filter]").forEach((btn) => {
        btn.classList.toggle("is-on", btn.dataset.segFilter === "all");
      });
      renderSegmentTable();
      if (typeof dialog.showModal === "function" && !dialog.open) dialog.showModal();
      else dialog.hidden = false;
    }

    document.addEventListener("click", (event) => {
      const openBtn = event.target && event.target.closest && event.target.closest("[data-segments]");
      if (openBtn) {
        event.preventDefault();
        openSegmentDialog(openBtn.dataset.segments);
        return;
      }
      const filterBtn = event.target && event.target.closest && event.target.closest("#segmentDialog [data-seg-filter]");
      if (filterBtn) {
        segmentFilter = filterBtn.dataset.segFilter || "all";
        document.querySelectorAll("#segmentDialog [data-seg-filter]").forEach((btn) => {
          btn.classList.toggle("is-on", btn === filterBtn);
        });
        renderSegmentTable();
      }
    });
    if ($("segmentClose")) {
      $("segmentClose").onclick = () => {
        const dialog = $("segmentDialog");
        if (dialog && typeof dialog.close === "function" && dialog.open) dialog.close();
        else if (dialog) dialog.hidden = true;
      };
    }

    function renderPlaybackReport(report) {
      const box = $("playbackReport");
      if (!box) return;
      const prev = box.querySelector("details.report-fold");
      const keepOpen = !!(prev && prev.open);
      box.hidden = false;
      box.innerHTML = reportHtml(report, { open: keepOpen });
    }

    async function loadPlaybackReport(runId, attempt) {
      if (!runId || currentRunId !== runId) return;
      let report;
      try {
        report = await api("/runs/" + runId + "/analyzer");
      } catch (e) {
        report = { available: false, reason: String(e.message || e) };
      }
      if (currentRunId !== runId) return;
      renderPlaybackReport(report);
      if (report && !report.available && (attempt || 0) < 4) {
        setTimeout(() => loadPlaybackReport(runId, (attempt || 0) + 1), 1000);
      }
    }

    function updateMonitorContext(run) {
      const el = $("monitorContext");
      if (!el) return;
      if (!run || !run.id) {
        el.textContent = "";
        el.title = "";
        el.hidden = true;
        return;
      }
      const summary = M.recipeSummaryFromSpec
        ? M.recipeSummaryFromSpec(run.spec || {}, { partMax: 14 })
        : { line: run.name || run.id, title: run.id };
      const time = formatRunTime(run);
      el.textContent = time && time !== "—" ? time : "";
      el.hidden = !el.textContent;
      el.title = (run.id || "") + (summary.title ? "\n" + summary.title : "");
    }

    function renderRun(run) {
      if (!run) {
        setTelemetryPolling(false);
        refreshTimeline(null);
        currentRunId = null;
        currentRunSpec = null;
        currentRunCollectSys = false;
        setSysMetersVisible(false);
        setRunControls("idle");
        syncRunChip(null);
        updateMonitorContext(null);
        setRecipeExpanded(true);
        setTelemWarn(false);
        clearSparks();
        renderQualityCards(null, null, null);
        return;
      }
      currentRunId = run.id;
      rememberRunSpec(run);
      setSysMetersVisible(currentRunCollectSys);
      syncRunChip(run);
      updateMonitorContext(run);
      const liveRun = run.status === "running" || run.status === "preparing";
      if (liveRun) {
        qualityMetrics = null;
        qualityRunId = null;
        lastFrameCount = -1;
        telemetryFailStreak = 0;
        setTelemWarn(false);
      }
      setTelemetryPolling(liveRun);
      if (!liveRun) {
        loadFinalMetrics(run.id).then((metrics) => {
          const armId = run.active_arm_id || (run.arms && run.arms[0] && run.arms[0].id);
          const arms = (metrics && metrics.arms) || {};
          renderQualityCards(metrics, armId, arms[armId] || arms[Object.keys(arms)[0]] || null);
        }).catch(() => { });
        loadPlaybackReport(run.id);
        setSysMetersVisible(currentRunCollectSys);
      } else {
        renderQualityCards(null, null, null, { pendingFinal: true });
        const report = $("playbackReport");
        if (report) {
          report.hidden = true;
          report.innerHTML = "";
        }
      }
      refreshTimeline(run);
      setRunControls(run.status || "idle");
      if (run.status !== "running" && run.status !== "preparing") {
        const armId = run.active_arm_id || (run.arms && run.arms[0] && run.arms[0].id);
        loadFullSparks(run.id, armId, true).catch(() => { });
      }
      if (!IN_SHELL) {
        if (run.status === "running" || run.status === "preparing") {
          setRecipeExpanded(false);
        } else if (run.status === "stopped" || run.status === "failed") {
          setRecipeExpanded(true);
        }
      }
      if (run.error) showRunErr(run.error);
    }

    let openHistoryId = null;
    let historyRuns = [];
    const selectedRuns = new Set();

    function getHistoryRun(runId) {
      return historyRuns.find((run) => run.id === runId) || null;
    }

    function isRunLive(run) {
      const s = run && run.status;
      return s === "running" || s === "preparing";
    }

    function currentControlsLive() {
      const s = ($("runControls") || {}).dataset && $("runControls").dataset.state;
      return s === "running" || s === "preparing";
    }

    async function resolveHistoryRun(runId) {
      return getHistoryRun(runId) || api("/runs/" + runId);
    }

    async function loadObservation(runId) {
      if (currentControlsLive() && currentRunId && currentRunId !== runId) {
        throw new Error("请先停止当前运行，再载入其它观测");
      }
      const run = await resolveHistoryRun(runId);
      if (!run || !run.id) throw new Error("找不到该运行");
      qualityMetrics = null;
      qualityRunId = null;
      lastFrameCount = -1;
      clearRunMsg();
      openHistoryId = runId;
      renderRun(run);
      const mon = $("monitor");
      setMonitorExpanded(true);
      if (mon && mon.scrollIntoView) mon.scrollIntoView({ behavior: "smooth", block: "start" });
      await loadExperiments();
    }

    async function loadNextRecipe(runId) {
      const run = await resolveHistoryRun(runId);
      if (!run || !run.spec) throw new Error("该运行没有保存配方");
      await ensureRecipeOptions();
      await refreshContentChoices();
      await applySpecToForm(run.spec);
      setRecipeExpanded(true);
      clearRunMsg();
      const box = $("runMsg");
      if (box) {
        box.className = "msg ok";
        box.textContent = "已载入下次配方（尚未开始）";
      }
      const panel = $("recipePanel");
      if (panel && panel.scrollIntoView) panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    async function rerunFromHistory(runId) {
      if (currentControlsLive()) {
        throw new Error("请先停止当前运行，再按此重跑");
      }
      await loadNextRecipe(runId);
      const summary = M.recipeSummaryFromSpec
        ? M.recipeSummaryFromSpec(buildSpecFromForm())
        : { title: runId, shortName: runId };
      const ok = window.confirm("按此配方开始新运行？\n\n" + (summary.title || summary.shortName || ""));
      if (!ok) return;
      await startCurrentRecipe();
    }

    function runStamp(run) {
      const raw = run && (run.started_at || run.created_at);
      const t = Date.parse(raw || "");
      return Number.isFinite(t) ? t : 0;
    }

    function formatRunTime(run) {
      const t = runStamp(run);
      if (!t) return "—";
      const d = new Date(t);
      const p = (n) => String(n).padStart(2, "0");
      return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function firstArmMetrics(run) {
      const arms = (run && run.metrics && run.metrics.arms) || {};
      const id = run && (run.active_arm_id || (run.arms && run.arms[0] && run.arms[0].id));
      return (id && arms[id]) || arms[Object.keys(arms)[0]] || null;
    }

    function fmtRebuffer(arm) {
      if (!arm) return "—";
      const value = arm.rebuffer_s != null ? arm.rebuffer_s : arm.stall_s;
      if (value == null || Number.isNaN(Number(value))) return "—";
      return (Math.round(Number(value) * 10) / 10) + " s";
    }

    function fmtBandwidth(arm) {
      if (!arm || arm.avg_bandwidth_bps == null) return "—";
      const mbps = Number(arm.avg_bandwidth_bps) / 1e6;
      if (!Number.isFinite(mbps)) return "—";
      return (Math.round(mbps * 10) / 10) + " Mbps";
    }

    function fmtQoe(arm) {
      if (!arm || arm.qoe == null || Number.isNaN(Number(arm.qoe))) return "—";
      return String(Math.round(Number(arm.qoe) * 10) / 10);
    }

    function fmtCompareNum(value, digits, suffix) {
      if (value == null || value === "" || Number.isNaN(Number(value))) return "—";
      const n = Number(value);
      const text = Number.isInteger(n) && digits === 0
        ? String(n)
        : String(Math.round(n * Math.pow(10, digits)) / Math.pow(10, digits));
      return suffix ? text + suffix : text;
    }
