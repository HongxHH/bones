          },
          {
            key: "metrics_status",
            label: "指标状态",
            format: (v) => (v == null || v === "" ? "—" : String(v)),
          },
        ],
      },
    ];

    function armMetricValue(arm, spec) {
      if (!arm) return null;
      if (arm[spec.key] != null) return arm[spec.key];
      if (spec.alt && arm[spec.alt] != null) return arm[spec.alt];
      return null;
    }

    function fmtCompareRate(value) {
      if (value == null || value === "" || Number.isNaN(Number(value))) return "—";
      return String(Math.round(Number(value) * 1000) / 10) + "%";
    }

    function formatCompareMetric(spec, value) {
      if (spec.format) return spec.format(value);
      return fmtCompareNum(value, spec.digits == null ? 2 : spec.digits, spec.suffix || "");
    }

    function valuesDiffer(texts) {
      const nonempty = texts.filter((t) => t && t !== "—");
      if (nonempty.length < 2) return false;
      return new Set(nonempty).size > 1;
    }

    async function loadArmMetricsForCompare(run) {
      // Rebuild metrics + merge analyzer enhance/abort stats for mechanism compare.
      let arm = firstArmMetrics(run);
      try {
        const metrics = await api("/runs/" + run.id + "/metrics");
        run.metrics = metrics;
        const cached = historyRuns.find((item) => item.id === run.id);
        if (cached) cached.metrics = metrics;
        arm = firstArmMetrics(run);
      } catch (e) {
        arm = firstArmMetrics(run);
      }
      try {
        const report = await api("/runs/" + run.id + "/analyzer");
        if (M.enrichArmFromAnalyzer) arm = M.enrichArmFromAnalyzer(arm, report);
        else if (arm && report && report.abort_reasons && !arm.abort_summary) {
          arm = Object.assign({}, arm, {
            abort_summary: Object.entries(report.abort_reasons || {})
              .map(([key, value]) => (ABORT_LABELS[key] || key) + ":" + value)
              .join("；"),
          });
        }
      } catch (e) {
        /* analyzer optional */
      }
      if (arm && arm.abort_reasons && !arm.abort_summary && M.formatAbortSummary) {
        arm.abort_summary = M.formatAbortSummary(arm.abort_reasons);
      }
      return arm;
    }

    function compareFairnessWarnings(cols) {
      const notes = [];
      const arms = cols.map((col) => col.arm || {});
      if (arms.some((arm) => arm.qoe == null && arm.avg_vmaf == null)) {
        notes.push("有的运行还没有画质/QoE，对比不完整");
      }
      const statuses = [...new Set(arms.map((arm) => arm.metrics_status || "").filter(Boolean))];
      if (statuses.length > 1) {
        notes.push("指标状态不一致：" + statuses.join(" / "));
      }
      const sources = [...new Set(arms.map((arm) => arm.quality_source || arm.outcome_source || "").filter(Boolean))];
      if (sources.length > 1) {
        notes.push("画质来源不一致：" + sources.join(" / ") + "（优先都用 analyzer 结局再比）");
      }
      const outcomes = [...new Set(arms.map((arm) => arm.outcome_source || "").filter(Boolean))];
      if (outcomes.includes("telemetry_planned") && outcomes.some((item) => item !== "telemetry_planned")) {
        notes.push("有的运行仍按计划增强档打分，abort 段可能虚高");
      }
      if (arms.some((arm) => arm.abort_total == null && arm.enh_l2_count == null)) {
        notes.push("有的运行缺少增强执行统计（还没有 analyzer）");
      }
      return notes;
    }

    function hideComparePanel() {
      const panel = $("comparePanel");
      if (panel) panel.hidden = true;
      const body = $("compareBody");
      if (body) body.innerHTML = "";
      const msg = $("compareMsg");
      if (msg) msg.textContent = "";
      setReviewFlag(false);
    }

    function renderCompareMetricGroup(cols, group) {
      const rows = group.rows.map((spec) => {
        const cells = cols.map((col) => formatCompareMetric(spec, armMetricValue(col.arm, spec)));
        if (cells.every((cell) => cell === "—")) return "";
        const diff = valuesDiffer(cells);
        return `<tr><td>${esc(spec.label)}</td>${cells.map((cell) =>
          `<td class="mono${diff ? " is-diff" : ""}">${esc(cell)}</td>`).join("")}</tr>`;
      }).join("");
      if (!rows) return "";
      return `<tr class="is-section"><td colspan="${cols.length + 1}">${esc(group.title)}</td></tr>${rows}`;
    }

    function renderCompareTable(cols) {
      const head = `<tr><th>项目</th>${cols.map((col) => {
        const title = esc(col.fullTitle || col.header);
        return `<th class="mono" title="${title}">${esc(col.header)}<div class="quiet">${esc(col.sub)}</div></th>`;
      }).join("")}</tr>`;

      const condRows = COMPARE_CONDS.map((spec) => {
        const cells = cols.map((col) => {
          const raw = col.parts[spec.key];
          return spec.format ? spec.format(raw) : (raw == null || raw === "" ? "—" : String(raw));
        });
        const diff = valuesDiffer(cells);
        return `<tr><td>${esc(spec.label)}</td>${cells.map((cell) =>
          `<td class="mono${diff ? " is-diff" : ""}">${esc(cell)}</td>`).join("")}</tr>`;
      }).join("");

      const metricBlocks = COMPARE_METRIC_GROUPS.map((group) => renderCompareMetricGroup(cols, group)).join("");

      return `<table class="compare"><thead>${head}</thead><tbody>`
        + `<tr class="is-section"><td colspan="${cols.length + 1}">条件</td></tr>${condRows}`
        + metricBlocks
        + `</tbody></table>`;
    }

    async function openCompare() {
      const ids = [...selectedRuns];
      const msg = $("compareMsg");
      const panel = $("comparePanel");
      const body = $("compareBody");
      const btn = $("histCompare");
      if (!panel || !body) return;
      if (ids.length < 2 || ids.length > 4) {
        if (msg) msg.textContent = "请选择 2～4 次运行再对比";
        panel.hidden = false;
        body.innerHTML = "";
        setReviewFlag(true);
        return;
      }
      if (btn) btn.disabled = true;
      panel.hidden = false;
      setReviewFlag(true);
      body.innerHTML = '<p class="quiet">读取指标…</p>';
      if (msg) msg.textContent = "";
      try {
        const cols = [];
        for (const id of ids) {
          const run = getHistoryRun(id) || await api("/runs/" + id);
          const arm = await loadArmMetricsForCompare(run);
          const summary = M.recipeSummaryFromSpec
            ? M.recipeSummaryFromSpec(run.spec || {}, { partMax: 14 })
            : { line: run.name || id, title: id, parts: {} };
          const parts = summary.parts || (M.recipePartsFromSpec
            ? M.recipePartsFromSpec(run.spec || {})
            : {});
          cols.push({
            id: run.id,
            header: formatRunTime(run),
            sub: summary.line,
            fullTitle: (run.id || "") + "\n" + (summary.title || ""),
            parts: parts,
            arm: arm,
          });
        }
        body.innerHTML = renderCompareTable(cols);
        const warnings = compareFairnessWarnings(cols);
        if (msg) {
          msg.textContent = warnings.length
            ? ("注意：" + warnings.join("；"))
            : "对比含播放质量、增强执行与 fast-complete；画质对齐 analyzer（质量表推算）。";
        }
        const hist = $("historyPanel");
        if (hist) hist.open = true;
        panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      } catch (e) {
        body.innerHTML = "";
        if (msg) msg.textContent = String(e.message || e);
      } finally {
        if (btn) {
          const n = selectedRuns.size;
          btn.disabled = n < 2 || n > 4;
        }
      }
    }

    function historyDetail(runId) {
      return [...document.querySelectorAll("tr.hist-detail")].find((el) => el.dataset.detailFor === runId) || null;
    }

    async function fillHistoryDetail(runId) {
      const row = historyDetail(runId);
      const box = row && row.querySelector(".hist-report");
      if (!box) return;
      const prev = box.querySelector("details.report-fold");
      const keepOpen = !!(prev && prev.open);
      box.textContent = "读取中…";
      let report;
      try {
        report = await api("/runs/" + runId + "/analyzer");
      } catch (e) {
        report = { available: false, reason: String(e.message || e) };
      }
      if (openHistoryId !== runId) return;
      const current = historyDetail(runId);
      const target = current && current.querySelector(".hist-report");
      if (!target) return;
      target.innerHTML = reportHtml(report, { open: keepOpen });
    }

    function renderHistory(runs) {
      const sorted = (runs || []).slice().sort((a, b) => runStamp(b) - runStamp(a));
      historyRuns = sorted;
      const host = $("runList");
      if (!host) return sorted;
      if (!sorted.length) {
        host.innerHTML = '<p class="hint">暂无运行</p>';
        return sorted;
      }
      if (openHistoryId && !sorted.some((run) => run.id === openHistoryId)) openHistoryId = null;
      host.innerHTML = `<table class="hist"><thead><tr><th class="hist-pick"><input class="hist-all" type="checkbox" title="全选"></th><th>时间</th><th>实验</th><th>状态</th><th>重缓冲</th><th>带宽</th><th>QoE</th><th></th></tr></thead><tbody>${sorted.map((run) => {
        const arm = firstArmMetrics(run);
        const open = openHistoryId === run.id;
        const busy = run.id === currentRunId && isRunLive(run);
        if (busy) selectedRuns.delete(run.id);
        const checked = selectedRuns.has(run.id) ? " checked" : "";
        const disabled = busy ? " disabled" : "";
        const recipe = M.recipeSummaryFromSpec
          ? M.recipeSummaryFromSpec(run.spec || {})
          : { title: "" };
        const rowTitle = [run.id, recipe.title].filter(Boolean).join("\n");
        const observing = currentRunId === run.id ? " is-observing" : "";
        return `<tr class="hist-row${open ? " is-open" : ""}${observing}" data-run-id="${esc(run.id)}" title="${esc(rowTitle)}"><td class="hist-pick"><input class="hist-check" type="checkbox" value="${esc(run.id)}"${checked}${disabled}></td><td>${esc(formatRunTime(run))}</td><td>${esc(run.name || "—")}</td><td>${esc(RUN_STATUS_LABEL[run.status] || run.status || "—")}</td><td>${esc(fmtRebuffer(arm))}</td><td>${esc(fmtBandwidth(arm))}</td><td>${esc(fmtQoe(arm))}</td><td><a href="/v1/runs/${esc(run.id)}/export?format=csv">CSV</a></td></tr><tr class="hist-detail" data-detail-for="${esc(run.id)}"${open ? "" : " hidden"}><td colspan="8"><div class="hist-actions"><button type="button" class="hist-act" data-act="observe" data-run-id="${esc(run.id)}">载入观测</button><button type="button" class="hist-act" data-act="recipe" data-run-id="${esc(run.id)}">载入下次配方</button><button type="button" class="hist-act" data-act="rerun" data-run-id="${esc(run.id)}">按此重跑</button></div><div class="report hist-report"></div></td></tr>`;
      }).join("")
        }</tbody></table>`;
      updateHistBar();
      if (openHistoryId) fillHistoryDetail(openHistoryId);
      return sorted;
    }

    async function loadExperiments() {
      await ensureRecipeOptions();
      await refreshContentChoices();
      if (!recipeInitialized) {
        await applySpecToForm(DEFAULT_SPEC);
        recipeInitialized = true;
      }
      const runs = await api("/runs");
      const sortedRuns = renderHistory(runs);
      if (currentRunId) {
        const live = (sortedRuns || []).find((r) => r.id === currentRunId);
        if (live) renderRun(live);
      }
    }

    function hideHistConfirm() {
      const ask = $("histConfirm");
      const btn = $("histDelete");
      if (ask) ask.hidden = true;
      if (btn) btn.hidden = false;
    }

    function updateHistBar() {
      const bar = $("histBar");
      const count = $("histCount");
      if (!bar || !count) return;
      const n = selectedRuns.size;
      bar.hidden = n < 1;
      count.textContent = "已选 " + n + " 项";
      if (n < 1) {
        hideHistConfirm();
        hideComparePanel();
      }
      const cmp = $("histCompare");
      if (cmp) {
        cmp.disabled = n < 2 || n > 4;
        cmp.title = n > 4 ? "最多选 4 项" : (n < 2 ? "至少选 2 项" : "并排查看所选运行");
      }
      const all = document.querySelector("#runList .hist-all");
      const boxes = [...document.querySelectorAll("#runList .hist-check:not(:disabled)")];
      if (all) {
        const picked = boxes.filter((box) => box.checked).length;
        all.checked = boxes.length > 0 && picked === boxes.length;
        all.indeterminate = picked > 0 && picked < boxes.length;
        all.disabled = boxes.length < 1;
      }
    }

    $("histCompare").onclick = () => {
      openCompare().catch((e) => {
        const msg = $("compareMsg");
        if (msg) msg.textContent = String(e.message || e);
      });
    };

    $("compareClose").onclick = () => {
      hideComparePanel();
    };

    $("histDelete").onclick = () => {
      const n = selectedRuns.size;
      if (!n) return;
      $("histConfirmText").textContent = "删除这 " + n + " 次运行？遥测、指标和分析文件会一起删掉。";
      $("histDelete").hidden = true;
      $("histConfirm").hidden = false;
      const msg = $("histMsg");
      if (msg) msg.textContent = "";
    };

    $("histConfirmNo").onclick = () => {
      hideHistConfirm();
    };

    $("histConfirmYes").onclick = async () => {
      const ids = [...selectedRuns];
      if (!ids.length) return;
      const yes = $("histConfirmYes");
      const no = $("histConfirmNo");
      yes.disabled = true;
      no.disabled = true;
      try {
        const result = await api("/runs/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids }),
        });
        (result.deleted || []).forEach((id) => selectedRuns.delete(id));
        if (currentRunId && (result.deleted || []).includes(currentRunId)) {
          currentRunId = null;
          openHistoryId = null;
          renderRun(null);
        } else if (openHistoryId && (result.deleted || []).includes(openHistoryId)) {
          openHistoryId = null;
        }
        const skipped = result.skipped || [];
        await loadExperiments();
        const msg = $("histMsg");
        if (msg && skipped.length) {
          msg.textContent = skipped.length + " 项仍在播放，没有删除。";
          $("histBar").hidden = false;
        }
      } catch (e) {
        const msg = $("histMsg");
        if (msg) msg.textContent = String(e.message || e);
      } finally {
        yes.disabled = false;
        no.disabled = false;
        hideHistConfirm();
      }
    };

    $("runList").addEventListener("change", (ev) => {
      const box = ev.target;
      if (!box || !box.classList) return;
      if (box.classList.contains("hist-all")) {
        document.querySelectorAll("#runList .hist-check:not(:disabled)").forEach((item) => {
          item.checked = box.checked;
          if (box.checked) selectedRuns.add(item.value);
          else selectedRuns.delete(item.value);
        });
        updateHistBar();
        return;
      }
      if (!box.classList.contains("hist-check")) return;
      if (box.checked) selectedRuns.add(box.value);
      else selectedRuns.delete(box.value);
      updateHistBar();
    });

    $("runList").addEventListener("click", async (ev) => {
      const actBtn = ev.target.closest("button.hist-act");
      if (actBtn) {
        ev.preventDefault();
        ev.stopPropagation();
        const act = actBtn.dataset.act;
        const id = actBtn.dataset.runId;
        if (!act || !id) return;
        actBtn.disabled = true;
        try {
          if (act === "observe") await loadObservation(id);
          else if (act === "recipe") await loadNextRecipe(id);
          else if (act === "rerun") await rerunFromHistory(id);
        } catch (e) {
          showRunErr(e.message || e);
        } finally {
          actBtn.disabled = false;
        }
        return;
      }
      if (ev.target.closest("a, input, button")) return;
      const row = ev.target.closest("tr.hist-row");
      if (!row) return;
      const id = row.dataset.runId;
      openHistoryId = openHistoryId === id ? null : id;
      document.querySelectorAll("tr.hist-row").forEach((el) => {
        el.classList.toggle("is-open", el.dataset.runId === openHistoryId);
      });
      document.querySelectorAll("tr.hist-detail").forEach((el) => {
        el.hidden = el.dataset.detailFor !== openHistoryId;
      });
      if (openHistoryId) fillHistoryDetail(openHistoryId);
    });

    async function refreshAll() {
      try {
        await api("/health");
        setConn(true, "控制面已连接 · Prism");
        const panel = document.querySelector(".panel.active")?.id?.replace("panel-", "") || "experiments";
        await loadPanel(panel);
      } catch (e) {
        setConn(false, "控制面不可用：" + e.message);
      }
    }

    async function loadPanel(name) {
      if (name === "experiments") await loadExperiments();
    }

    document.querySelectorAll(".nav-btn[data-panel]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        document.querySelectorAll(".nav-btn[data-panel]").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        const name = btn.dataset.panel;
        $("panel-" + name).classList.add("active");
        try { await loadPanel(name); } catch (e) { setConn(false, e.message); }
      });
    });

    function resolveSpecFromEditor() {
      return buildSpecFromForm();
    }

    async function waitRunReady(runId) {
      for (let i = 0; i < 120; i++) {
        const run = await api("/runs/" + runId);
        if (run.status !== "preparing" && run.status !== "queued") return run;
        await new Promise((r) => setTimeout(r, 100));
      }
      return api("/runs/" + runId);
    }

    bindInventoryToggle("btnReadyInv", "invReady");
    bindInventoryToggle("btnPendingInv", "invPending");

    $("frameSlider").oninput = () => {
      const slider = $("frameSlider");
      paintTimelineTrack(slider);
      const frame = Number(slider.value);
      if (timeline.timer) clearTimeout(timeline.timer);
      timeline.timer = setTimeout(() => scrubTo(frame), 60);
    };
    $("btnKeepFrames").onclick = async () => {
      if (!timeline.runId || !timeline.armId) {
        setFrameMeta("还没有可保留的画面");
        return;
      }
      try {
        const saved = await api(
          `/runs/${timeline.runId}/frames/save?arm_id=${encodeURIComponent(timeline.armId)}`,
          { method: "POST" },
        );
        const path = (saved && saved.path) || "";
        setFrameMeta(path ? ("已保留到 " + path) : "已保留", path || "");
      } catch (e) {
        setFrameMeta(String(e.message || e));
      }
    };
    $("btnLive").onclick = async () => {
      timeline.holding = false;
      try {
        await api("/system/picture", { method: "DELETE" });
      } catch (e) { /* ignore */ }
      if (timeline.totals && Object.values(timeline.totals).some((n) => n > 0)) {
        const max = Math.max(...Object.values(timeline.totals));
        setFrameMeta(max + " 帧");
      } else {
        setFrameMeta("");
      }
    };
    ["fldContent", "fldNes", "fldEnhancer", "fldRenderer", "fldTraceFile"].forEach((id) => {
      const el = $(id);
      if (el) el.addEventListener("change", onRecipeFormChange);
    });
    if ($("fldWorkspace")) {
      $("fldWorkspace").addEventListener("change", () => {
        applyWorkspaceDefaults();
      });
    }
    $("fldNetMode").addEventListener("change", async () => {
      const on = $("fldNetMode").value === "trace";
      setTraceControlsEnabled(on);
      if (on) {
        const ds = $("fldTraceDataset").value
          || (recipeOpts && recipeOpts.trace_datasets && recipeOpts.trace_datasets[0] && recipeOpts.trace_datasets[0].id)
          || "";
        if (ds) {
          $("fldTraceDataset").value = ds;
          await loadTraceFiles(ds);
        }
      } else {
        $("fldTraceSearch").value = "";
        $("traceHint").textContent = "";
      }
      onRecipeFormChange();
    });
    $("fldTraceDataset").addEventListener("change", async () => {
      $("fldTraceSearch").value = "";
      await loadTraceFiles($("fldTraceDataset").value);
      onRecipeFormChange();
    });
    $("fldTraceSearch").addEventListener("input", () => {
      if (traceSearchTimer) clearTimeout(traceSearchTimer);
      traceSearchTimer = setTimeout(async () => {
        const ds = $("fldTraceDataset").value;
        if (!ds || $("fldNetMode").value !== "trace") return;
        try {
          await loadTraceFiles(ds);
          onRecipeFormChange();
        } catch (e) {
          $("traceHint").textContent = String(e.message || e);
        }
      }, 250);
    });
    $("btnTraceRandom").onclick = async () => {
      try {
        await pickRandomTrace();
        clearRunMsg();
      } catch (e) {
        showRunErr(e.message || e);
      }
    };
    async function startCurrentRecipe() {
      const spec = resolveSpecFromEditor();
      if ($("fldNetMode").value === "trace" && !(armPlayer(spec).trace || "").trim()) {
        throw new Error("已选轨迹限速，但未选择轨迹文件");
      }
      if (!warnBeforeStart(spec)) return null;
      if (!spec.metadata || typeof spec.metadata !== "object") spec.metadata = {};
      if (M.recipeSummaryFromSpec) {
        spec.metadata.name = M.recipeSummaryFromSpec(spec).shortName;
      }
      clearRunMsg();
      setRunControls("preparing");
      let run = await api("/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          spec,
          attach_players: true,
          wait: false,
        }),
      });
      run = await waitRunReady(run.id);
      if (run.status === "failed") throw new Error(run.error || "preparation failed");
      const armFail = (run.arms || []).find((a) => a.status === "failed");
      if (armFail) {
        throw new Error(armFail.error || ("播放器启动失败：" + armFail.id));
      }
      lastStartedSpec = JSON.parse(JSON.stringify(spec));
      clearRunMsg();
      setRecipeExpanded(false);
      renderRun(run);
      await loadExperiments();
      return run;
    }

    $("btnStartRun").onclick = async () => {
      try {
        await startCurrentRecipe();
      } catch (e) {
        showRunErr(e.message || e);
        setRunControls(currentRunId ? "stopped" : "idle");
        setRecipeExpanded(true);
      }
    };
    $("btnStopRun").onclick = async () => {
      if (!currentRunId) return;
      try {
        const run = await api("/runs/" + currentRunId + "/stop", { method: "POST" });
        clearRunMsg();
        renderRun(run);
        await loadExperiments();
      } catch (e) {
        showRunErr(e.message || e);
      }
    };

    setRunControls("idle");
    refreshAll();
    setInterval(() => {
      api("/health").then(() => setConn(true, "控制面已连接 · Prism"))
        .catch((e) => setConn(false, "控制面不可用：" + e.message));
    }, 5000);
  </script>
</body>

</html>
